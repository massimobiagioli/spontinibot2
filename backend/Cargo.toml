[package]
name = "backend"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Gates the `bdd_e2e` integration test so it never runs under a plain
# `cargo test` (which `make test`, `make coverage`, and `make verify` all
# invoke) — it requires a live stack and real models, and must only run via
# `make bdd-e2e`.
e2e = []

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
kb-store = { path = "../kb-store" }
ingest-core = { path = "../ingest-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pdf-extract = "0.7"
docx-rs = "0.4"
rtf-parser = { version = "0.4", default-features = false }
dashmap = "6"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
scraper = "0.22"
url = "2"

[dev-dependencies]
cucumber = "0.21"
tower-http = { version = "0.6", features = ["trace"] }
wiremock = "0.6"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

[[test]]
name = "bdd_e2e"
path = "tests/bdd_e2e.rs"
harness = false
required-features = ["e2e"]
