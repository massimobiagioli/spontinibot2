worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker's embedded DNS server — re-resolve "backend" periodically instead
    # of caching its IP for the container's entire lifetime. Without this, a
    # `backend` container recreation (rebuild, `docker compose restart`, or
    # the eject-data/use-data Makefile targets) leaves this proxy silently
    # pointing at a dead IP until admin-ui itself is restarted.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html references hashed asset filenames (e.g.
        # index-y6dSgN8N.css) that change on every build — but Vite's
        # build output gives index.html itself the same weak heuristic
        # caching as everything else, with no explicit Cache-Control. A
        # browser that caches index.html keeps requesting the OLD hashed
        # asset names indefinitely after a redeploy, silently masking any
        # fix shipped since (this is a real, confirmed cause of the font
        # fix appearing not to have taken effect after redeploy). Force
        # revalidation on the one file whose staleness actually matters.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location /admin/api/ {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
