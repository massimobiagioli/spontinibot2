[package]
name = "ingest"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
chrono = "0.4"
cron = "0.13"
ingest-core = { path = "../ingest-core" }
kb-store = { path = "../kb-store" }
tokio = { version = "1", features = ["rt", "macros", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
wiremock = "0.6"
tempfile = "3"
