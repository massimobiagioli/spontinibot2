# Production overlay for docker-compose.yml.
#
# ADR 0002 pins the base docker-compose.yml to `target: build` for backend/
# ingest so `docker compose run --rm <svc> cargo ...` works without Rust on
# the host. That ~2 GB dev image is never what should ship. Frontend/admin-ui
# have the analogous problem: their single dev image bundles the full
# devDependency tree (vite/vitest/esbuild) and a Chromium install needed only
# for `npm run test`/`npm run a11y`, never for serving the built `dist/` via
# nginx. This overlay switches all four owned services to a slim `runtime`
# stage/target and applies memory/CPU limits sized for the Mac Intel i7 /
# 16 GB RAM target, plus healthchecks for the 3 services that don't have one
# in the base file.
#
# Each owned service gets an explicit distinct `image:` tag (`:prod`) so
# building the runtime stage here never overwrites the dev image that
# `docker compose run --rm <svc> cargo|npm ...` (make test/lint/coverage/a11y)
# relies on — the two stages must coexist as separate tags, not share one.
#
# Usage: make prod-build / make prod-up / make prod-down
# (docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>)

services:
  backend:
    image: spontini-bot-2-backend:prod
    build:
      target: runtime
    mem_limit: 1g
    cpus: 1.0

  admin-ui:
    image: spontini-bot-2-admin-ui:prod
    build:
      target: runtime
    mem_limit: 256m
    cpus: 0.5

  ingest:
    image: spontini-bot-2-ingest:prod
    build:
      target: runtime
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/ingest-heartbeat -mmin -1 2>/dev/null | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: spontini-bot-2-frontend:prod
    build:
      target: runtime
    mem_limit: 256m
    cpus: 0.5

  llama-embed:
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  llama-generate:
    mem_limit: 4g
    cpus: 4.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
