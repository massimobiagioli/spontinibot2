services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    ports:
      - "8080:8080"
    volumes:
      - kb-data:/data
    depends_on:
      - llama-embed
      - llama-generate
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
      target: build
    volumes:
      - kb-data:/data
    depends_on:
      - llama-embed
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models/embed:/models
    command: ["--model", "/models/nomic-embed-text-q4.gguf", "--embeddings"]
    restart: unless-stopped

  llama-generate:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models/generate:/models
    command: ["--model", "/models/qwen2.5-3b-instruct-q4_k_m.gguf"]
    restart: unless-stopped

volumes:
  kb-data:
