services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    ports:
      - "8080:8080"
    environment:
      # ADR 0013: lowered from default 5 to shrink the RAG prompt (dominant
      # latency cost, see llama-generate's comment above) while real testing
      # showed 2 retrieved chunks still gave correct, complete answers.
      - RAG_TOP_K=2
      # TEST-INGESTION-0001 Wave 0 found every question (including
      # deliberately out-of-KB ones) retrieved chunks and never fell back
      # at the 0.35 default. Real testing across 0.35-0.9 found NO value
      # that cleanly separates relevant from irrelevant content for this
      # KB/embedding model — legitimate and out-of-KB questions' best-chunk
      # scores overlap and aren't even consistently ordered. 0.6 is a modest,
      # honest improvement, not a fix — see Appendix C for the full data and
      # why this needs a different technique (re-ranking / hybrid search),
      # not further threshold tuning.
      - RAG_MIN_SCORE=0.6
      # Operator credentials: .env (gitignored) overrides these defaults.
      # If both OPERATOR_USERNAME and OPERATOR_PASSWORD are set, the backend
      # auto-creates the credential file on startup (idempotent — existing
      # files are never overwritten).
      - OPERATOR_USERNAME=${OPERATOR_USERNAME:-operator}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD:-QEZdZaoRdQBOVUMNpZQ03n4R/I4qgAzn}
      # Plan 0030: the only place any curation-eligible domain is named for
      # this deployment. No domain is hardcoded in the backend binary itself
      # (see Config::from_env) — comma-separated, empty/unset means the
      # non-interactive curation path is off and every source goes through
      # the normal robots.txt-honoring scrape pipeline.
      - CURATION_ALLOWED_HOSTS=${CURATION_ALLOWED_HOSTS:-halleyweb.com}
    volumes:
      - kb-data:/data
      # ADR 0016: `/train` writes curated instructional notes here from the
      # host repo; bind-mounted (not the `kb-data` volume) so they stay
      # version-controlled alongside AGENTS.md, and read-only because the
      # backend only ever reads this directory, never writes to it.
      - ./.project/training:/app/training:ro
    depends_on:
      - llama-embed
      - llama-generate
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      target: build
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
      target: build
    volumes:
      - kb-data:/data
    depends_on:
      - llama-embed
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    ports:
      - "5174:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models/embed:/models
    # --batch-size/--ubatch-size raised from the server's 512 default: real chunks
    # from ingest-core's 512-*token* chunker come out larger by the embed model's
    # own tokenizer (678/659 observed on real Wikipedia text), so the server was
    # rejecting them with "input is too large to process" (TEST-INGESTION-0001.md
    # Appendix C). 2048 leaves headroom above the observed worst case.
    command: ["--model", "/models/nomic-embed-text-q4.gguf", "--embeddings", "--batch-size", "2048", "--ubatch-size", "2048"]
    restart: unless-stopped

  llama-generate:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models/generate:/models
    # 1.5B (ADR 0013, supersedes ADR 0001's 3B choice): real benchmarking on this
    # hardware showed prompt-processing time dominates latency and is CPU-bound,
    # not fixable by threading — the 3B->1.5B swap plus RAG_TOP_K=2 (backend env
    # below) is the real, measured improvement path (~95s -> ~30s average).
    command: ["--model", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--batch-size", "2048", "--ubatch-size", "2048"]
    restart: unless-stopped

volumes:
  kb-data:
