services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    ports:
      - "8080:8080"
    volumes:
      - kb-data:/data
    depends_on:
      - llama-embed
      - llama-generate
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      target: build
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
      target: build
    volumes:
      - kb-data:/data
    depends_on:
      - llama-embed
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    ports:
      - "5174:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models/embed:/models
    # --batch-size/--ubatch-size raised from the server's 512 default: real chunks
    # from ingest-core's 512-*token* chunker come out larger by the embed model's
    # own tokenizer (678/659 observed on real Wikipedia text), so the server was
    # rejecting them with "input is too large to process" (TEST-INGESTION-0001.md
    # Appendix C). 2048 leaves headroom above the observed worst case.
    command: ["--model", "/models/nomic-embed-text-q4.gguf", "--embeddings", "--batch-size", "2048", "--ubatch-size", "2048"]
    restart: unless-stopped

  llama-generate:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models/generate:/models
    command: ["--model", "/models/qwen2.5-3b-instruct-q4_k_m.gguf"]
    restart: unless-stopped

volumes:
  kb-data:
