[package]
name = "ingest-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ingest-core = { path = "../ingest-core" }
kb-store = { path = "../kb-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
wiremock = "0.6"
